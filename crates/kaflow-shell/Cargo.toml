[package]
name = "kaflow-shell"
version = "0.1.0"
edition = "2021"
description = "Kaflow desktop shell — Tauri command layer over the KafkaToolEngine trait"
# No `license` field: see the LICENSE file at the repository root.
publish = false

# This crate reaches the engine only through the `KafkaToolEngine` trait, so it can be built
# against any implementation of it — the mock engine included.
[features]
# Turned on by the binary. The shell has no debug commands of its own; it only lets
# `build_info` tell the frontend that this is a debug build.
debug-api = []

[dependencies]
kaflow-api-types = { path = "../kaflow-api-types" }
kaflow-api-traits = { path = "../kaflow-api-traits" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Total/free disk space for the storage gauge.
fs2 = "0.4"
# Machine identifier, hashed before it is used anywhere.
machine-uid = "0.5"
# Hashes the machine identifier. The raw value is never sent or stored.
sha2 = "0.10"
