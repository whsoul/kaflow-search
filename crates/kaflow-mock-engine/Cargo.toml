[package]
name = "kaflow-mock-engine"
version = "0.1.0"
edition = "2021"
description = "Kaflow mock engine — a KafkaToolEngine implementation for CI and demos, with no infrastructure dependencies"
# No `license` field: see the LICENSE file at the repository root.
# Not published to crates.io. The repository is source-available rather than open
# source, so a crate leaving it would carry terms crates.io does not express.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
kaflow-api-traits = { path = "../kaflow-api-traits" }
kaflow-api-types = { path = "../kaflow-api-types" }
# Keeps the demo splitting CJK text the way the real engine does.
kaflow-tokenizer = { path = "../kaflow-tokenizer" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
