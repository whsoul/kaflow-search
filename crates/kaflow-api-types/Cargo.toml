[package]
name = "kaflow-api-types"
version = "0.1.0"
edition = "2021"
description = "Kaflow public API DTO types — pure data, infra-free"
# No `license` field: see the LICENSE file at the repository root.
# Not published to crates.io. The repository is source-available rather than open
# source, so a crate leaving it would carry terms crates.io does not express.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# JSONL serialization for export — pure data conversion, no infrastructure.
serde_json = "1"
