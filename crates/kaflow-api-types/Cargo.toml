[package]
name = "kaflow-api-types"
version = "0.1.0"
edition = "2021"
description = "Kaflow public API DTO types — pure data, infra-free"
# license 필드 없음 = proprietary/source-available (루트 LICENSE 참조).
# Apache-2.0 오픈은 추후 결정 시 명시적으로 (library_split_design.md §6-L, 2026-07-16 개정).

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# export.rs JSONL 직렬화 — 순수 데이터 변환(인프라 의존 아님).
serde_json = "1"
