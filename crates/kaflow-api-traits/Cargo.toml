[package]
name = "kaflow-api-traits"
version = "0.1.0"
edition = "2021"
description = "Kaflow public API traits — engine / progress / deserializer / schema source seams"
# No `license` field: see the LICENSE file at the repository root.
# Not published to crates.io. The repository is source-available rather than open
# source, so a crate leaving it would carry terms crates.io does not express.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
kaflow-api-types = { path = "../kaflow-api-types" }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
