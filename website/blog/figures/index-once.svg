<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img" aria-label="Two indexing modes on a time axis. Both begin with one full read. In manual mode a single increment follows when the topic is picked again. With autoSync, small increments run on a timer while the app is open.">
<style>
svg{
  --ink:#f4f5f8; --ink-2:#9ba3b8; --ink-3:#6f778d;
  --surface:#111522;
  --rule:rgba(255,255,255,.13); --rule-strong:rgba(255,255,255,.26);
  --cost:#c9915a; --local:#8b7cff;
  --arrow:#7b849a;
  background:#090b12;
}
.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.ns{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--ink-3)}
.zl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;fill:var(--ink-3)}
.seg{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;font-weight:600}
.inbar{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;fill:var(--ink)}
path.arw{stroke:var(--arrow);stroke-width:1.4;fill:none}
</style>
  <defs>
    <marker id="t" viewBox="0 0 8 6" refX="7.5" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text class="zl" x="20" y="34">Indexing over time</text>
  <line x1="20" y1="46" x2="960" y2="46" stroke="var(--rule)" stroke-width="1"/>

  <text class="n" x="20" y="92">Manual</text>
  <text class="ns" x="20" y="108">you decide when</text>
  <rect x="250" y="76" width="380" height="38" rx="3" fill="var(--cost)" fill-opacity=".55"/>
  <text class="inbar" x="440" y="100" text-anchor="middle">2,099,964 messages</text>
  <rect x="680" y="76" width="150" height="38" rx="3" fill="var(--local)"/>
  <text class="seg" x="440" y="132" text-anchor="middle" fill="var(--cost)">one full read</text>
  <text class="seg" x="755" y="132" text-anchor="middle" fill="var(--local)">one increment, when you pick it again</text>

  <text class="n" x="20" y="206">autoSync</text>
  <text class="ns" x="20" y="222">while the app is open</text>
  <rect x="250" y="190" width="380" height="38" rx="3" fill="var(--cost)" fill-opacity=".55"/>
  <text class="inbar" x="440" y="214" text-anchor="middle">2,099,964 messages</text>
  <rect x="650" y="190" width="40" height="38" rx="3" fill="var(--local)"/>
  <rect x="712" y="190" width="40" height="38" rx="3" fill="var(--local)"/>
  <rect x="774" y="190" width="40" height="38" rx="3" fill="var(--local)"/>
  <rect x="836" y="190" width="40" height="38" rx="3" fill="var(--local)"/>
  <rect x="898" y="190" width="40" height="38" rx="3" fill="var(--local)"/>
  <text class="seg" x="440" y="246" text-anchor="middle" fill="var(--cost)">one full read</text>
  <text class="seg" x="794" y="246" text-anchor="middle" fill="var(--local)">a slice on a timer</text>

  <path class="arw" d="M250,276 L950,276" marker-end="url(#t)"/>
  <text class="ns" x="250" y="294">time</text>
  <text class="ns" x="950" y="294" text-anchor="end">Schematic. The first read dwarfs every increment after it.</text>
</svg>
