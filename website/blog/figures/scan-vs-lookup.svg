<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-label="Two pipelines side by side. Consuming and filtering pulls every message out of the cluster and tests each one; an index lookup seeks straight to the matching block of sorted terms and reads only those messages.">
<style>
svg{
  --ink:#f4f5f8; --ink-2:#9ba3b8; --ink-3:#6f778d;
  --surface:#111522; --surface-2:#171c2c;
  --rule:rgba(255,255,255,.13); --rule-strong:rgba(255,255,255,.26);
  --cost:#c9915a; --cost-line:#6d5436;
  --local:#8b7cff; --local-line:#5b51a8;
  --arrow:#7b849a;
  background:#090b12;
}
.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.ns{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--ink-3)}
.zl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tot{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
path.arw{stroke:var(--arrow);stroke-width:1.4;fill:none}
</style>
  <defs>
    <marker id="a" viewBox="0 0 8 6" refX="7.5" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <line x1="490" y1="18" x2="490" y2="482" stroke="var(--rule)" stroke-width="1"/>

  <text class="zl" x="250" y="30" text-anchor="middle" fill="var(--cost)">Consume + filter</text>
  <text class="zl" x="730" y="30" text-anchor="middle" fill="var(--local)">Index lookup</text>

  <!-- stage 1 -->
  <rect x="130" y="52" width="240" height="44" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1.2"/>
  <text class="n" x="250" y="79" text-anchor="middle">Search query</text>
  <rect x="610" y="52" width="240" height="44" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1.2"/>
  <text class="n" x="730" y="79" text-anchor="middle">Search query</text>
  <path class="arw" d="M250,96 L250,116" marker-end="url(#a)"/>
  <path class="arw" d="M730,96 L730,116" marker-end="url(#a)"/>

  <!-- stage 2 -->
  <rect x="130" y="120" width="240" height="48" rx="4" fill="var(--surface)" stroke="var(--cost-line)" stroke-width="1.4"/>
  <text class="n" x="250" y="142" text-anchor="middle" fill="var(--cost)">Kafka cluster</text>
  <text class="ns" x="250" y="158" text-anchor="middle">consume from offset</text>
  <rect x="610" y="120" width="240" height="48" rx="4" fill="var(--surface)" stroke="var(--local-line)" stroke-width="1.4"/>
  <text class="n" x="730" y="142" text-anchor="middle" fill="var(--local)">Local index</text>
  <text class="ns" x="730" y="158" text-anchor="middle">sorted terms, on disk</text>
  <path class="arw" d="M250,168 L250,188" marker-end="url(#a)"/>
  <path class="arw" d="M730,168 L730,188" marker-end="url(#a)"/>

  <!-- stage 3 : left = scan every message -->
  <rect x="130" y="192" width="240" height="196" rx="4" fill="var(--surface-2)" stroke="var(--cost-line)" stroke-width="1.2"/>
  <text class="ns" x="250" y="210" text-anchor="middle">test every message</text>
  <rect x="146" y="220" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="236" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="252" width="208" height="12" rx="2" fill="var(--local)"/>
  <rect x="146" y="268" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="284" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="300" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="316" width="208" height="12" rx="2" fill="var(--local)"/>
  <rect x="146" y="332" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <rect x="146" y="348" width="208" height="12" rx="2" fill="var(--cost)" fill-opacity=".5"/>
  <text class="ns" x="250" y="376" text-anchor="middle">&#8230; 2,099,964 of them</text>
  <path class="arw" d="M118,220 L118,360" marker-end="url(#a)" stroke="var(--cost)"/>
  <text class="mono" x="110" y="294" text-anchor="end" fill="var(--cost)">scan</text>

  <!-- stage 3 : right = seek into sorted terms -->
  <rect x="610" y="192" width="240" height="196" rx="4" fill="var(--surface-2)" stroke="var(--local-line)" stroke-width="1.2"/>
  <text class="mono" x="730" y="210" text-anchor="middle" fill="var(--local)">prefix "order-58"</text>
  <rect x="626" y="220" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="236" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="252" width="208" height="12" rx="2" fill="var(--local)"/>
  <rect x="626" y="268" width="208" height="12" rx="2" fill="var(--local)"/>
  <rect x="626" y="284" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="300" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="316" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="332" width="208" height="12" rx="2" fill="var(--rule)"/>
  <rect x="626" y="348" width="208" height="12" rx="2" fill="var(--rule)"/>
  <text class="ns" x="730" y="376" text-anchor="middle">the rest is never touched</text>
  <path class="arw" d="M566,258 L622,258" marker-end="url(#a)" stroke="var(--local)"/>
  <text class="mono" x="560" y="262" text-anchor="end" fill="var(--local)">seek</text>

  <path class="arw" d="M250,388 L250,408" marker-end="url(#a)"/>
  <path class="arw" d="M730,388 L730,408" marker-end="url(#a)"/>

  <!-- stage 4 -->
  <rect x="130" y="412" width="240" height="44" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1.2"/>
  <text class="n" x="250" y="439" text-anchor="middle">2 results</text>
  <rect x="610" y="412" width="240" height="44" rx="4" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="1.2"/>
  <text class="n" x="730" y="439" text-anchor="middle">2 results</text>

  <text class="tot" x="250" y="482" text-anchor="middle" fill="var(--cost)">2,099,964 read</text>
  <text class="tot" x="730" y="482" text-anchor="middle" fill="var(--local)">2 read</text>
</svg>
