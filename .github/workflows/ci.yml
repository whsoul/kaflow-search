name: Build

# Does the published copy of the Rust workspace compile and pass its tests on its own?
#
# Correctness of these sources is settled in the authoring repository before anything is
# copied here. What is not settled is whether the copy that arrived is complete. A publish
# that omits a file leaves the authoring repository perfectly green and breaks only here.
#
# The trigger covers every crate, not only the demo binary. The failure this job exists to
# catch is a change in one crate breaking another — a trait gaining a method that
# kaflow-mock-engine does not implement, say. Narrowing the trigger to the binary would
# skip exactly that case.
#
# Not this repository's job, on purpose:
#   - Desktop bundles for macOS and Windows. Expensive, and tangled up with signing and
#     release, which belong where the sources are authored.
#   - Anything that publishes. Code moves one way, in to here. A workflow that pushed back
#     out would create the return path this split exists to prevent.
#   - Secrets. There are none, and there should stay none: once this repository is public,
#     workflows run on pull requests from forks.
#   - Formatting and lint. The sources are authored elsewhere; a complaint raised here has
#     nowhere to be fixed.
#
# `push: ["**"]` together with `pull_request` would run every pull request commit twice,
# once per event. Push is limited to main so each situation runs once — a branch through
# its pull request, main through its push.

on:
  push:
    branches: [main]
    paths: ['crates/**', 'bin/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ci.yml']
  pull_request:
    paths: ['crates/**', 'bin/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ci.yml']
  workflow_dispatch:

# Only the newest commit on a branch is worth a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (mock engine only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri system dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo test (public crates)
        run: cargo test -p kaflow-mock-engine -p kaflow-shell
