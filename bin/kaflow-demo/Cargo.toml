[package]
name = "kaflow-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kaflow Search — public demo app (mock engine over local fixtures)"

# The demo binary wires the mock engine + the public Tauri shell + the prebuilt
# frontend (../../dist) into a runnable app — no private crates, no real Kafka.
# `cargo tauri dev` from this directory launches it on bundled example data.

[[bin]]
name = "kaflow-demo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kaflow-api-traits = { path = "../../crates/kaflow-api-traits" }
kaflow-mock-engine = { path = "../../crates/kaflow-mock-engine" }
kaflow-shell = { path = "../../crates/kaflow-shell" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
